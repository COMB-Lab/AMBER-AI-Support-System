version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.0
  environment:
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor   # <-- simple dev, no external DB
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/dags/scripts
  # NOTE: keep 'user' if your Windows host creates permission issues; else you can remove it
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-0}"

services:
  airflow-init:
    <<: *airflow-common
    container_name: amber_airflow_init
    entrypoint: ["/bin/bash", "-c"]
    command: >
      airflow db init &&
      airflow users create
      --username admin --password admin
      --firstname Admin --lastname User
      --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    container_name: amber_airflow_web
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: amber_airflow_scheduler
    command: scheduler
    depends_on:
      - airflow-webserver

  # Handy for VS Code: attach to this as your interpreter
  airflow-dev:
    <<: *airflow-common
    container_name: amber_airflow_dev
    command: ["python", "-c", "import time; time.sleep(10**9)"]
